[mod]
id = "mousefix"
version = "0.1.0"
priority = 100

# The commit it was tested on. It hooks only native hook points (hooks 114 in
# compatibility.json), so the launcher builds it on any Horizon that has them.
[compatibility]
horizon_revision = "fff2a81e41d98414d5dd6b92a626c747f3471492"

# runtime.rs becomes the module crate::game::mousefix.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "mousefix"
source = "runtime.rs"

# The mod's row in Options > Mods (its switch).
[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# After every mod has had its say on a real mouse button event (RETURN, so the
# final `canceled` is seen, typed mods included): a cancelled release never
# reaches `play_mouse`, so the logical button is released here.
[[injection]]
id = "cancelled-release"
kind = "RETURN"
target = "horizon_client::game::native_hooks::Game<'_>::native_mouse_button_pre"
helper = "release.rs"
bindings = [
  { name = "_result", ty = "()", value = "$value" },
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "button", ty = "i32", value = "button" },
  { name = "pressed", ty = "bool", value = "pressed" },
  { name = "canceled", ty = "&bool", value = "&*canceled" },
]

# Sleeping and Alt-Tab: keep the toggles and left/right in step, once a tick
# and once a frame (a window in the background may stop drawing).
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]
